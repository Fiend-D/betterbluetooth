[project]
name = "betterbluetooth"
version = "1.1.19"
description = "Cross-platform Bluetooth device manager with per-device battery tray icons"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "dbus-fast>=2.0; sys_platform == 'linux'",
    "evdev>=1.6; sys_platform == 'linux'",
    "hidapi>=0.14; sys_platform == 'win32'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Power>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Radios>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Gaming.Input>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.System.Power>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "pillow"]

[project.gui-scripts]
betterbluetooth = "betterbluetooth.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["betterbluetooth*"]
