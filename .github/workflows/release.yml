name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install pyinstaller pillow
      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python build.py
          VERSION=$(python -c "import betterbluetooth; print(betterbluetooth.__version__)")
          NAME="BetterBluetooth-${VERSION}-linux-x86_64"
          STAGE="build/linux/${NAME}"
          mkdir -p "$STAGE" release
          cp -a dist/linux/BetterBluetooth "$STAGE/"
          cp build/linux/icon.png "$STAGE/betterbluetooth.png"
          cp packaging/linux/install.sh packaging/linux/setup-input-remap.sh \
             packaging/linux/99-betterbluetooth-uinput.rules "$STAGE/"
          chmod +x "$STAGE/install.sh" "$STAGE/setup-input-remap.sh"
          rm -f "$STAGE/BetterBluetooth"/_internal/libfontconfig.so* \
                "$STAGE/BetterBluetooth"/_internal/libfreetype.so* || true
          tar -C build/linux -czf "release/${NAME}.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: release/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install "PySide6-Essentials==6.9.3" "shiboken6==6.9.3" pyinstaller pillow hidapi \
            winrt-runtime \
            winrt-Windows.Devices.Bluetooth \
            winrt-Windows.Devices.Bluetooth.GenericAttributeProfile \
            winrt-Windows.Devices.Enumeration \
            winrt-Windows.Devices.Power \
            winrt-Windows.Devices.Radios \
            winrt-Windows.Foundation \
            winrt-Windows.Foundation.Collections \
            winrt-Windows.Gaming.Input \
            winrt-Windows.Storage.Streams \
            winrt-Windows.System.Power
          pip install -e . --no-deps
      - name: Build onedir + onefile
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python build.py
          VERSION=$(python -c "import betterbluetooth; print(betterbluetooth.__version__)")
          NAME="BetterBluetooth-${VERSION}-windows-x64"
          mkdir -p release
          python - <<PY
          import zipfile
          from pathlib import Path
          root = Path("dist/windows/BetterBluetooth")
          out = Path("release/${NAME}-portable.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
              for p in root.rglob("*"):
                  if p.is_file():
                      zf.write(p, p.relative_to(root.parent).as_posix())
          print("wrote", out, out.stat().st_size)
          PY
          python build.py --onefile
          cp dist/windows/BetterBluetooth.exe "release/${NAME}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            release/*.exe
            release/*-portable.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.exe' -o -name '*.zip' \) -exec cp -v {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -lh
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('../betterbluetooth/__init__.py').read())[1])")
          TAG="v${VERSION}"
          cat > ../RELEASE_NOTES.md <<EOF
          ## BetterBluetooth ${VERSION}

          ### 亮点
          - 按设备按键测试 / 系统级改键（键盘、手柄、Joy-Con）
          - 108 全键拟真键盘，按品牌自动换肤
          - 稳定设备身份：重新配对后电量历史与改键方案可合并
          - Linux 系统改键安全修复（避免吞键），附 uinput 权限脚本

          ### 下载
          - **Windows**：\`BetterBluetooth-${VERSION}-windows-x64.exe\` 或便携 zip
          - **Linux**：\`BetterBluetooth-${VERSION}-linux-x86_64.tar.gz\`（解压后 \`./install.sh\`）

          Linux 系统级改键需配置 \`/dev/uinput\` 权限，见包内 \`setup-input-remap.sh\`。
          EOF
          # strip YAML-leading spaces from notes
          sed -i 's/^          //' ../RELEASE_NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
            gh release edit "$TAG" --notes-file ../RELEASE_NOTES.md
          else
            gh release create "$TAG" ./* --title "BetterBluetooth ${VERSION}" --notes-file ../RELEASE_NOTES.md
          fi
